services:
  - type: web
    name: masterdocs-frontend
    runtime: static
    rootDir: masterdocs-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA fallback: React Router owns /merge, /split, /compress, etc.
    # Without this, a direct browser hit on those paths 404s because no
    # matching file exists in dist/.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
